<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Interclasse 2026 | Pomba D'Amizade</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f1f5f9;
      color: #111827;
    }

    header {
      background: #0f172a;
      color: white;
      text-align: center;
      padding: 25px 15px;
    }

    header h1 {
      margin: 0;
      font-size: 28px;
    }

    header p {
      margin: 8px 0 0;
      color: #cbd5e1;
    }

    .container {
      width: 95%;
      max-width: 1100px;
      margin: 25px auto;
    }

    .card {
      background: white;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 25px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.08);
    }

    .card h2 {
      margin-top: 0;
      color: #0f172a;
    }

    .status {
      text-align: center;
      padding: 10px;
      border-radius: 8px;
      margin-bottom: 20px;
      font-weight: bold;
    }

    .status.ok {
      background: #dcfce7;
      color: #166534;
    }

    .status.erro {
      background: #fee2e2;
      color: #991b1b;
    }

    .table-container {
      width: 100%;
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 750px;
    }

    th {
      background: #0f172a;
      color: white;
      padding: 12px 8px;
      text-align: center;
    }

    td {
      padding: 11px 8px;
      text-align: center;
      border-bottom: 1px solid #e5e7eb;
    }

    tr:nth-child(even) {
      background: #f8fafc;
    }

    td.equipa {
      text-align: left;
      font-weight: bold;
    }

    .posicao {
      font-weight: bold;
    }

    .pontos {
      font-weight: bold;
      font-size: 17px;
    }

    .jogo {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
      padding: 15px;
      border-bottom: 1px solid #e5e7eb;
    }

    .jogo:last-child {
      border-bottom: none;
    }

    .equipas-jogo {
      flex: 1;
      font-weight: bold;
    }

    .resultado {
      font-size: 20px;
      font-weight: bold;
      min-width: 70px;
      text-align: center;
    }

    .estado {
      font-size: 13px;
      padding: 5px 9px;
      border-radius: 6px;
      background: #e5e7eb;
    }

    .terminado {
      background: #dcfce7;
      color: #166534;
    }

    .agendado {
      background: #dbeafe;
      color: #1e40af;
    }

    .vazio {
      text-align: center;
      padding: 20px;
      color: #64748b;
    }

    footer {
      text-align: center;
      padding: 25px;
      color: #64748b;
      font-size: 14px;
    }

    @media (max-width: 600px) {

      header h1 {
        font-size: 22px;
      }

      .card {
        padding: 15px;
      }

      .jogo {
        flex-direction: column;
        text-align: center;
      }
    }
  </style>
</head>

<body>

  <header>
    <h1>🏆 Interclasse 2026</h1>
    <p>Colégio Pomba D'Amizade</p>
  </header>

  <main class="container">

    <div id="status" class="status">
      🔄 A carregar dados...
    </div>

    <section class="card">

      <h2>📊 Classificação</h2>

      <div class="table-container">

        <table>

          <thead>
            <tr>
              <th>Pos</th>
              <th>Equipa</th>
              <th>PJ</th>
              <th>V</th>
              <th>E</th>
              <th>D</th>
              <th>GM</th>
              <th>GS</th>
              <th>SG</th>
              <th>PTS</th>
            </tr>
          </thead>

          <tbody id="classificacao">

            <tr>
              <td colspan="10" class="vazio">
                A carregar classificação...
              </td>
            </tr>

          </tbody>

        </table>

      </div>

    </section>

    <section class="card">

      <h2>⚽ Jogos</h2>

      <div id="jogos">

        <div class="vazio">
          A carregar jogos...
        </div>

      </div>

    </section>

  </main>

  <footer>
    Interclasse 2026 — Colégio Pomba D'Amizade
    <br>
    Atualização automática
  </footer>


  <script>

    const clienteSupabase = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_ANON_KEY
    );


    const tabelaClassificacao =
      document.getElementById("classificacao");

    const listaJogos =
      document.getElementById("jogos");

    const status =
      document.getElementById("status");


    async function carregarClassificacao() {

      const { data: equipas, error: erroEquipas } =
        await clienteSupabase
          .from("equipas")
          .select("id, nome");

      if (erroEquipas) {
        throw erroEquipas;
      }


      const { data: classificacao, error: erroClassificacao } =
        await clienteSupabase
          .from("classificacao")
          .select(`
            equipa_id,
            jogos,
            vitorias,
            empates,
            derrotas,
            pontos_marcados,
            pontos_sofridos,
            pontos
          `);

      if (erroClassificacao) {
        throw erroClassificacao;
      }


      const dados = classificacao.map(item => {

        const equipa =
          equipas.find(e => e.id === item.equipa_id);

        const gm =
          Number(item.pontos_marcados || 0);

        const gs =
          Number(item.pontos_sofridos || 0);

        return {

          nome: equipa
            ? equipa.nome
            : "Equipa",

          jogos:
            Number(item.jogos || 0),

          vitorias:
            Number(item.vitorias || 0),

          empates:
            Number(item.empates || 0),

          derrotas:
            Number(item.derrotas || 0),

          gm: gm,

          gs: gs,

          sg: gm - gs,

          pontos:
            Number(item.pontos || 0)

        };

      });


      dados.sort((a, b) => {

        if (b.pontos !== a.pontos) {
          return b.pontos - a.pontos;
        }

        if (b.sg !== a.sg) {
          return b.sg - a.sg;
        }

        return b.gm - a.gm;

      });


      tabelaClassificacao.innerHTML = "";


      dados.forEach((equipa, index) => {

        const linha =
          document.createElement("tr");

        linha.innerHTML = `

          <td class="posicao">
            ${index + 1}
          </td>

          <td class="equipa">
            ${escaparHTML(equipa.nome)}
          </td>

          <td>
            ${equipa.jogos}
          </td>

          <td>
            ${equipa.vitorias}
          </td>

          <td>
            ${equipa.empates}
          </td>

          <td>
            ${equipa.derrotas}
          </td>

          <td>
            ${equipa.gm}
          </td>

          <td>
            ${equipa.gs}
          </td>

          <td>
            ${equipa.sg}
          </td>

          <td class="pontos">
            ${equipa.pontos}
          </td>

        `;

        tabelaClassificacao.appendChild(linha);

      });

    }


    async function carregarJogos() {

      const { data: jogos, error } =
        await clienteSupabase
          .from("jogos")
          .select(`
            id,
            equipa_casa_id,
            equipa_fora_id,
            data_jogo,
            hora_jogo,
            local,
            pontos_casa,
            pontos_fora,
            estado
          `)
          .order("data_jogo", {
            ascending: true
          })
          .order("hora_jogo", {
            ascending: true
          });


      if (error) {
        throw error;
      }


      const { data: equipas, error: erroEquipas } =
        await clienteSupabase
          .from("equipas")
          .select("id, nome");


      if (erroEquipas) {
        throw erroEquipas;
      }


      if (!jogos || jogos.length === 0) {

        listaJogos.innerHTML = `
          <div class="vazio">
            Nenhum jogo encontrado.
          </div>
        `;

        return;
      }


      listaJogos.innerHTML = "";


      jogos.forEach(jogo => {

        const equipaCasa =
          equipas.find(
            e => e.id === jogo.equipa_casa_id
          );

        const equipaFora =
          equipas.find(
            e => e.id === jogo.equipa_fora_id
          );


        const nomeCasa =
          equipaCasa
            ? equipaCasa.nome
            : "Equipa";

        const nomeFora =
          equipaFora
            ? equipaFora.nome
            : "Equipa";


        const terminado =
          jogo.estado === "terminado";


        const resultado =
          terminado
            ? `${jogo.pontos_casa} - ${jogo.pontos_fora}`
            : "vs";


        const data =
          jogo.data_jogo
            ? formatarData(jogo.data_jogo)
            : "";


        const hora =
          jogo.hora_jogo
            ? jogo.hora_jogo.substring(0, 5)
            : "";


        const div =
          document.createElement("div");

        div.className = "jogo";


        div.innerHTML = `

          <div class="equipas-jogo">

            <div>
              ${escaparHTML(nomeCasa)}
            </div>

            <div>
              ${escaparHTML(nomeFora)}
            </div>

            ${
              data || hora
                ? `<small>
                     ${data}
                     ${hora ? " • " + hora : ""}
                   </small>`
                : ""
            }

            ${
              jogo.local
                ? `<small>
                     📍 ${escaparHTML(jogo.local)}
                   </small>`
                : ""
            }

          </div>


          <div class="resultado">
            ${resultado}
          </div>


          <div>

            <span class="estado ${
              terminado
                ? "terminado"
                : "agendado"
            }">

              ${
                terminado
                  ? "Terminado"
                  : "Agendado"
              }

            </span>

          </div>

        `;


        listaJogos.appendChild(div);

      });

    }


    function formatarData(data) {

      const partes =
        data.split("-");

      if (partes.length !== 3) {
        return data;
      }

      return `${partes[2]}/${partes[1]}/${partes[0]}`;

    }


    function escaparHTML(texto) {

      if (
        texto === null ||
        texto === undefined
      ) {
        return "";
      }

      return String(texto)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

    }


    async function carregarTudo() {

      status.className = "status";

      status.textContent =
        "🔄 A atualizar dados...";


      try {

        await Promise.all([
          carregarClassificacao(),
          carregarJogos()
        ]);


        status.className =
          "status ok";

        status.textContent =
          "🟢 Dados atualizados";

      }

      catch (erro) {

        console.error(erro);

        status.className =
          "status erro";

        status.textContent =
          "🔴 Erro ao atualizar os dados";

      }

    }


    carregarTudo();


    setInterval(() => {

      carregarTudo();

    }, 10000);

  </script>

</body>
</html>
