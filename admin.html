<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Painel de Administrador - Pomba D'Amizade</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f2f4f7;
      margin: 0;
      padding: 20px;
    }

    h1 {
      text-align: center;
      color: #123b6d;
    }

    .caixa {
      background: white;
      padding: 20px;
      margin: 20px auto;
      max-width: 900px;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }

    h2 {
      color: #123b6d;
    }

    button {
      background: #123b6d;
      color: white;
      border: none;
      padding: 10px 15px;
      border-radius: 7px;
      cursor: pointer;
      margin: 5px;
    }

    button:hover {
      opacity: 0.9;
    }

    .equipa {
      padding: 10px;
      border-bottom: 1px solid #ddd;
    }

    .jogo {
      padding: 12px;
      border-bottom: 1px solid #ddd;
    }

    .status {
      font-weight: bold;
    }

    .sucesso {
      color: green;
    }

    .erro {
      color: red;
    }

    #mensagem {
      text-align: center;
      font-weight: bold;
      margin: 15px;
    }
  </style>
</head>

<body>

  <h1>🏆 Painel de Administrador</h1>

  <div id="mensagem">A ligar ao banco de dados...</div>

  <div class="caixa">
    <h2>⚽ Equipas</h2>
    <div id="listaEquipas">
      A carregar equipas...
    </div>
  </div>

  <div class="caixa">
    <h2>📅 Jogos</h2>
    <div id="listaJogos">
      A carregar jogos...
    </div>
  </div>

  <div class="caixa">
    <h2>🔄 Atualizar</h2>
    <button onclick="carregarDados()">Atualizar dados</button>
  </div>

  <script>

    // ==========================================
    // CONFIGURAÇÃO DO SUPABASE
    // ==========================================

    const SUPABASE_URL = "https://ezszalkllbumkpobuilc.supabase.co";

    // COLOCA AQUI A TUA PUBLISHABLE KEY
    const SUPABASE_KEY = "sb_publishable_kC3NtuituZzsy2DtCzDI0w_i7-zyWC2";

    const supabase = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );


    // ==========================================
    // CARREGAR EQUIPAS
    // ==========================================

    async function carregarEquipas() {

      const { data, error } = await supabase
        .from("equipas")
        .select("*")
        .order("id");

      if (error) {
        document.getElementById("listaEquipas").innerHTML =
          '<p class="erro">Erro ao carregar equipas.</p>';

        console.error(error);
        return;
      }

      let html = "";

      if (data.length === 0) {
        html = "<p>Nenhuma equipa encontrada.</p>";
      } else {

        data.forEach(equipa => {

          html += `
            <div class="equipa">
              <strong>${equipa.id}. ${equipa.nome}</strong>
              <br>
              Grupo: ${equipa.grupo || "-"}
              <br>
              Estado: ${equipa.cor || "normal"}
            </div>
          `;

        });
      }

      document.getElementById("listaEquipas").innerHTML = html;
    }


    // ==========================================
    // CARREGAR JOGOS
    // ==========================================

    async function carregarJogos() {

      const { data, error } = await supabase
        .from("jogos")
        .select(`
          *,
          equipa_casa:equipas!jogos_equipa_casa_id_fkey(nome),
          equipa_fora:equipas!jogos_equipa_fora_id_fkey(nome)
        `)
        .order("data_hora");

      if (error) {

        document.getElementById("listaJogos").innerHTML =
          '<p class="erro">Erro ao carregar jogos.</p>';

        console.error(error);
        return;
      }

      let html = "";

      if (data.length === 0) {

        html = "<p>Nenhum jogo encontrado.</p>";

      } else {

        data.forEach(jogo => {

          html += `
            <div class="jogo">

              <strong>
                ${jogo.equipa_casa?.nome || "Equipa"} 
                🆚 
                ${jogo.equipa_fora?.nome || "Equipa"}
              </strong>

              <br><br>

              Data: ${jogo.data_hora || "-"}
              <br>

              Local: ${jogo.local || "-"}
              <br>

              Resultado:
              ${jogo.golos_casa ?? 0}
              -
              ${jogo.golos_fora ?? 0}

              <br>

              Estado:
              <span class="status">
                ${jogo.estado || "agendado"}
              </span>

            </div>
          `;

        });
      }

      document.getElementById("listaJogos").innerHTML = html;
    }


    // ==========================================
    // CARREGAR TODOS OS DADOS
    // ==========================================

    async function carregarDados() {

      document.getElementById("mensagem").innerText =
        "A carregar dados...";

      await carregarEquipas();
      await carregarJogos();

      document.getElementById("mensagem").innerHTML =
        '<span class="sucesso">✅ Ligação ao Supabase funcionando!</span>';
    }


    // ==========================================
    // INICIAR
    // ==========================================

    carregarDados();

  </script>

</body>
    </html>
