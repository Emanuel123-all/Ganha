<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Painel de Administrador - Pomba D'Amizade</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>

    body {
      font-family: Arial, sans-serif;
      background: #f2f4f7;
      margin: 0;
      padding: 20px;
    }

    h1 {
      text-align: center;
      color: #123b6d;
    }

    .caixa {
      background: white;
      padding: 20px;
      margin: 20px auto;
      max-width: 900px;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }

    h2 {
      color: #123b6d;
    }

    button {
      background: #123b6d;
      color: white;
      border: none;
      padding: 10px 15px;
      border-radius: 7px;
      cursor: pointer;
      margin: 5px;
    }

    button:hover {
      opacity: 0.9;
    }

    .equipa,
    .jogo {
      padding: 15px;
      border-bottom: 1px solid #ddd;
    }

    .jogo {
      margin-bottom: 10px;
      border: 1px solid #ddd;
      border-radius: 8px;
      background: #fafafa;
    }

    .resultado {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 10px;
      flex-wrap: wrap;
    }

    .resultado input {
      width: 55px;
      padding: 8px;
      font-size: 18px;
      text-align: center;
      border: 1px solid #aaa;
      border-radius: 6px;
    }

    .guardar {
      background: #198754;
    }

    .sucesso {
      color: green;
      font-weight: bold;
    }

    .erro {
      color: red;
      font-weight: bold;
    }

    #mensagem {
      text-align: center;
      font-weight: bold;
      margin: 15px;
    }

    .estado {
      margin-top: 8px;
    }

    select {
      padding: 8px;
      border-radius: 6px;
      border: 1px solid #aaa;
    }

  </style>
</head>

<body>

  <h1>🏆 Painel de Administrador</h1>

  <div id="mensagem">
    A ligar ao banco de dados...
  </div>


  <!-- ========================================== -->
  <!-- EQUIPAS -->
  <!-- ========================================== -->

  <div class="caixa">

    <h2>⚽ Equipas</h2>

    <div id="listaEquipas">
      A carregar equipas...
    </div>

  </div>


  <!-- ========================================== -->
  <!-- JOGOS -->
  <!-- ========================================== -->

  <div class="caixa">

    <h2>📅 Jogos</h2>

    <div id="listaJogos">
      A carregar jogos...
    </div>

  </div>


  <!-- ========================================== -->
  <!-- ATUALIZAR -->
  <!-- ========================================== -->

  <div class="caixa">

    <h2>🔄 Atualizar</h2>

    <button onclick="carregarDados()">
      🔄 Atualizar dados
    </button>

  </div>


  <script>

    // ==========================================
    // CONFIGURAÇÃO DO SUPABASE
    // ==========================================

    const SUPABASE_URL =
      "https://ezszalkllbumkpobuilc.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_kC3NtuituZzsy2DtCzDI0w_i7-zyWC2";


    const clienteSupabase = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );


    // ==========================================
    // CARREGAR EQUIPAS
    // ==========================================

    async function carregarEquipas() {

      const { data, error } = await clienteSupabase
        .from("equipas")
        .select("*")
        .order("id");

      if (error) {

        console.error("Erro nas equipas:", error);

        document.getElementById("listaEquipas").innerHTML =
          '<p class="erro">❌ Erro ao carregar as equipas.</p>';

        throw error;
      }


      let html = "";


      if (!data || data.length === 0) {

        html = "<p>Nenhuma equipa encontrada.</p>";

      } else {

        data.forEach(equipa => {

          html += `
            <div class="equipa">

              <strong>
                ${equipa.id}. ${equipa.nome}
              </strong>

              <br>

              Grupo:
              ${equipa.grupo || "-"}

              <br>

              Cor/estado:
              ${equipa.cor || "normal"}

            </div>
          `;

        });
      }


      document.getElementById("listaEquipas").innerHTML = html;

    }


    // ==========================================
    // CARREGAR JOGOS
    // ==========================================

    async function carregarJogos() {

      const { data: jogos, error: erroJogos } =
        await clienteSupabase
          .from("jogos")
          .select(`
            id,
            equipa_casa_id,
            equipa_fora_id,
            data_jogo,
            hora_jogo,
            local,
            pontos_casa,
            pontos_fora,
            estado
          `)
          .order("data_jogo", { ascending: true });


      if (erroJogos) {

        console.error("Erro nos jogos:", erroJogos);

        document.getElementById("listaJogos").innerHTML =
          '<p class="erro">❌ Erro ao carregar os jogos.</p>';

        throw erroJogos;
      }


      // Buscar nomes das equipas

      const { data: equipas, error: erroEquipas } =
        await clienteSupabase
          .from("equipas")
          .select("id, nome");


      if (erroEquipas) {

        console.error("Erro nas equipas:", erroEquipas);

        document.getElementById("listaJogos").innerHTML =
          '<p class="erro">❌ Erro ao carregar as equipas dos jogos.</p>';

        throw erroEquipas;
      }


      let html = "";


      if (!jogos || jogos.length === 0) {

        html = "<p>Nenhum jogo encontrado.</p>";

      } else {

        jogos.forEach(jogo => {

          const equipaCasa = equipas.find(
            equipa => equipa.id === jogo.equipa_casa_id
          );


          const equipaFora = equipas.find(
            equipa => equipa.id === jogo.equipa_fora_id
          );


          html += `
            <div class="jogo">

              <strong>

                ${equipaCasa
                  ? equipaCasa.nome
                  : "Equipa desconhecida"}

                🆚

                ${equipaFora
                  ? equipaFora.nome
                  : "Equipa desconhecida"}

              </strong>

              <br><br>


              📅 Data:
              ${jogo.data_jogo || "-"}

              <br>

              🕐 Hora:
              ${jogo.hora_jogo || "-"}

              <br>

              📍 Local:
              ${jogo.local || "-"}


              <div class="resultado">

                <strong>
                  Resultado:
                </strong>

                <input
                  type="number"
                  id="casa-${jogo.id}"
                  min="0"
                  value="${jogo.pontos_casa ?? 0}"
                >

                <strong>
                  -
                </strong>

                <input
                  type="number"
                  id="fora-${jogo.id}"
                  min="0"
                  value="${jogo.pontos_fora ?? 0}"
                >

              </div>


              <div class="estado">

                📌 Estado:

                <select id="estado-${jogo.id}">

                  <option
                    value="agendado"
                    ${jogo.estado === "agendado" ? "selected" : ""}
                  >
                    Agendado
                  </option>

                  <option
                    value="em andamento"
                    ${jogo.estado === "em andamento" ? "selected" : ""}
                  >
                    Em andamento
                  </option>

                  <option
                    value="terminado"
                    ${jogo.estado === "terminado" ? "selected" : ""}
                  >
                    Terminado
                  </option>

                </select>

              </div>


              <button
                class="guardar"
                onclick="guardarResultado(${jogo.id})"
              >
                💾 Guardar resultado
              </button>

            </div>
          `;

        });
      }


      document.getElementById("listaJogos").innerHTML = html;

    }


    // ==========================================
    // GUARDAR RESULTADO
    // ==========================================

    async function guardarResultado(id) {

  const pontosCasa =
    document.getElementById(`casa-${id}`).value;

  const pontosFora =
    document.getElementById(`fora-${id}`).value;

  const estado =
    document.getElementById(`estado-${id}`).value;


  if (pontosCasa === "" || pontosFora === "") {

    alert("⚠️ Coloca os dois resultados.");

    return;
  }


  const { data, error } = await clienteSupabase
    .from("jogos")
    .update({
      pontos_casa: Number(pontosCasa),
      pontos_fora: Number(pontosFora),
      estado: estado
    })
    .eq("id", id)
    .select("id, pontos_casa, pontos_fora, estado")
    .single();


  if (error) {

    console.error("Erro ao guardar resultado:", error);

    alert(
      "❌ Erro ao guardar o resultado:\n\n" +
      error.message
    );

    return;
  }


  if (!data) {

    alert(
      "⚠️ O Supabase não atualizou nenhum jogo.\n\n" +
      "Verifica as permissões da tabela jogos."
    );

    return;
  }


  console.log("Jogo atualizado:", data);


  alert(
    "✅ Resultado guardado com sucesso!\n\n" +
    `${data.pontos_casa} - ${data.pontos_fora}\n` +
    `Estado: ${data.estado}`
  );


  await carregarJogos();

    }    // ==========================================
    // CARREGAR TODOS OS DADOS
    // ==========================================

    async function carregarDados() {

      try {

        document.getElementById("mensagem").innerHTML =
          "⏳ A carregar dados...";


        document.getElementById("mensagem").className = "";


        document.getElementById("listaEquipas").innerHTML =
          "<p>⏳ A carregar equipas...</p>";


        document.getElementById("listaJogos").innerHTML =
          "<p>⏳ A carregar jogos...</p>";


        await carregarEquipas();

        await carregarJogos();


        document.getElementById("mensagem").innerHTML =
          "✅ Dados carregados com sucesso!";

        document.getElementById("mensagem").className =
          "sucesso";

      }


      catch (error) {

        console.error(
          "Erro ao carregar dados:",
          error
        );


        document.getElementById("mensagem").innerHTML =
          "❌ Não foi possível carregar os dados.";

        document.getElementById("mensagem").className =
          "erro";

      }

    }


    // ==========================================
    // INICIAR PAINEL
    // ==========================================

    carregarDados();

  </script>

</body>
</html>
