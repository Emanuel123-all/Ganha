<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Painel de Administrador - Pomba D'Amizade</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f1f5f9;
      margin: 0;
      color: #111827;
    }

    header {
      background: #0f172a;
      color: white;
      text-align: center;
      padding: 25px 15px;
    }

    header h1 {
      margin: 0;
      font-size: 26px;
    }

    header p {
      color: #cbd5e1;
      margin-bottom: 0;
    }

    .container {
      width: 95%;
      max-width: 1000px;
      margin: 20px auto;
    }

    .caixa {
      background: white;
      padding: 20px;
      margin-bottom: 20px;
      border-radius: 12px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.08);
    }

    h2 {
      margin-top: 0;
      color: #0f172a;
    }

    input, select {
      width: 100%;
      padding: 11px;
      margin: 6px 0;
      border: 1px solid #cbd5e1;
      border-radius: 7px;
      font-size: 15px;
    }

    button {
      border: none;
      border-radius: 7px;
      padding: 10px 14px;
      margin: 5px 3px;
      cursor: pointer;
      color: white;
      font-weight: bold;
    }

    button:hover {
      opacity: 0.88;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .btn-principal { background: #0f172a; }
    .btn-verde { background: #198754; }
    .btn-vermelho { background: #dc2626; }
    .btn-azul { background: #2563eb; }

    .mensagem {
      padding: 12px;
      margin-bottom: 20px;
      border-radius: 8px;
      text-align: center;
      font-weight: bold;
      background: #e2e8f0;
      overflow-wrap: anywhere;
    }

    .sucesso {
      background: #dcfce7;
      color: #166534;
    }

    .erro {
      background: #fee2e2;
      color: #991b1b;
    }

    .equipa {
      padding: 14px;
      border-bottom: 1px solid #e5e7eb;
    }

    .jogo {
      padding: 15px;
      margin-bottom: 12px;
      border: 1px solid #e5e7eb;
      border-radius: 10px;
      background: #f8fafc;
    }

    .jogo strong {
      font-size: 16px;
    }

    .resultado {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 12px;
    }

    .resultado input {
      width: 65px;
      text-align: center;
      font-size: 18px;
    }

    .vazio {
      color: #64748b;
      text-align: center;
      padding: 15px;
    }

    .linha {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .info {
      padding: 10px;
      margin-top: 10px;
      background: #f8fafc;
      border-radius: 7px;
      font-size: 14px;
    }

    .titulo-fase {
      background: #e2e8f0;
      padding: 10px;
      border-radius: 7px;
      margin: 20px 0 12px;
      color: #0f172a;
    }

    .estado {
      display: inline-block;
      padding: 5px 9px;
      border-radius: 5px;
      background: #e2e8f0;
      font-size: 12px;
      margin-top: 8px;
    }

    @media (max-width: 600px) {
      .linha {
        grid-template-columns: 1fr;
      }

      .caixa {
        padding: 15px;
      }
    }
  </style>
</head>

<body>

<header>
  <h1>🏆 Painel de Administrador</h1>
  <p>Interclasse 2026 — Colégio Pomba D'Amizade</p>
</header>

<main class="container">

  <div id="mensagem" class="mensagem">
    🔄 A ligar ao Supabase...
  </div>

  <!-- ADICIONAR EQUIPA -->

  <section class="caixa">
    <h2>➕ Adicionar equipa</h2>

    <input
      type="text"
      id="nomeEquipa"
      placeholder="Nome da equipa"
    >

    <input
      type="text"
      id="grupoEquipa"
      placeholder="Grupo (ex.: A)"
    >

    <button class="btn-verde" onclick="adicionarEquipa()">
      ➕ Adicionar equipa
    </button>
  </section>

  <!-- EQUIPAS -->

  <section class="caixa">
    <h2>👥 Equipas</h2>

    <div id="listaEquipas">
      A carregar...
    </div>
  </section>

  <!-- ADICIONAR JOGO -->

  <section class="caixa">
    <h2>⚽ Adicionar jogo</h2>

    <label>Fase da competição</label>

    <select id="faseJogo">
      <option value="6">Fase de grupos</option>
    </select>

    <div class="linha">
      <div>
        <label>Equipa da casa</label>
        <select id="equipaCasa">
          <option value="">Selecionar equipa</option>
        </select>
      </div>

      <div>
        <label>Equipa visitante</label>
        <select id="equipaFora">
          <option value="">Selecionar equipa</option>
        </select>
      </div>
    </div>

    <div class="linha">
      <div>
        <label>Data</label>
        <input type="date" id="dataJogo">
      </div>

      <div>
        <label>Hora</label>
        <input type="time" id="horaJogo">
      </div>
    </div>

    <input
      type="text"
      id="localJogo"
      placeholder="Local do jogo"
    >

    <button class="btn-azul" onclick="adicionarJogo()">
      ➕ Criar jogo
    </button>
  </section>

  <!-- JOGOS -->

  <section class="caixa">
    <h2>📅 Jogos da competição</h2>

    <div id="listaJogos">
      A carregar...
    </div>
  </section>

  <!-- ATUALIZAR -->

  <section class="caixa">
    <button class="btn-principal" onclick="carregarDados()">
      🔄 Atualizar dados
    </button>
  </section>

</main>

<script>

// ==========================================
// SUPABASE
// ==========================================

let clienteSupabase = null;

let equipasCache = [];
let fasesCache = [];

const IDS_FASES = [6, 7, 8, 9];

const NOMES_FASES = {
  6: "Fase de grupos",
  7: "Quartos de final",
  8: "Semifinais",
  9: "Final"
};

try {

  if (
    typeof SUPABASE_URL === "undefined" ||
    typeof SUPABASE_ANON_KEY === "undefined"
  ) {
    throw new Error(
      "SUPABASE_URL ou SUPABASE_ANON_KEY não encontrados."
    );
  }

  clienteSupabase = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_ANON_KEY
  );

} catch (error) {

  console.error(error);

  mostrarMensagem(
    "🔴 Erro na configuração do Supabase: " + error.message,
    "erro"
  );

}


// ==========================================
// MENSAGENS
// ==========================================

function mostrarMensagem(texto, tipo = "") {

  const elemento = document.getElementById("mensagem");

  elemento.textContent = texto;
  elemento.className = "mensagem " + tipo;

}


// ==========================================
// ESCAPAR HTML
// ==========================================

function escaparHTML(texto) {

  if (texto === null || texto === undefined) {
    return "";
  }

  return String(texto)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");

}


// ==========================================
// CARREGAR FASES
// ==========================================

async function carregarFases() {

  const { data, error } = await clienteSupabase
    .from("fases")
    .select("id, nome, ordem")
    .in("id", IDS_FASES)
    .order("ordem", { ascending: true });

  if (error) {
    console.error("Erro ao carregar fases:", error);
    throw error;
  }

  const mapa = new Map(
    (data || []).map(fase => [Number(fase.id), fase])
  );

  const faltantes = IDS_FASES.filter(id => !mapa.has(id));

  if (faltantes.length > 0) {
    throw new Error(
      "Não foram encontradas as fases com IDs: " +
      faltantes.join(", ")
    );
  }

  fasesCache = IDS_FASES.map(id => mapa.get(id));

  atualizarSelectFases();

}


// ==========================================
// SELECT DE FASES
// ==========================================

function atualizarSelectFases() {

  const select = document.getElementById("faseJogo");

  select.innerHTML = "";

  fasesCache.forEach(fase => {

    const option = document.createElement("option");

    option.value = fase.id;
    option.textContent = fase.nome;

    select.appendChild(option);

  });

  select.value = "6";

}


// ==========================================
// NOMES DAS FASES
// ==========================================

function obterNomeFase(id) {

  const fase = fasesCache.find(
    item => Number(item.id) === Number(id)
  );

  return fase
    ? fase.nome
    : NOMES_FASES[id] || "Fase desconhecida";

}


// ==========================================
// CARREGAR EQUIPAS
// ==========================================

async function carregarEquipas() {

  const { data, error } = await clienteSupabase
    .from("equipas")
    .select("id, nome, grupo, cor")
    .order("id", { ascending: true });

  if (error) {
    console.error(error);
    throw error;
  }

  equipasCache = data || [];

  const lista = document.getElementById("listaEquipas");

  lista.innerHTML = "";

  if (equipasCache.length === 0) {

    lista.innerHTML =
      '<p class="vazio">Nenhuma equipa cadastrada.</p>';

  } else {

    equipasCache.forEach(equipa => {

      const div = document.createElement("div");

      div.className = "equipa";

      div.innerHTML = `

        <strong>${escaparHTML(equipa.nome)}</strong>

        <div class="info">

          👥 Grupo:
          ${escaparHTML(equipa.grupo || "-")}

          <br><br>

          🎨 Estado:
          ${escaparHTML(equipa.cor || "normal")}

        </div>

        <button
          class="btn-vermelho"
          onclick="apagarEquipa(${Number(equipa.id)})"
        >
          🗑️ Apagar equipa
        </button>

      `;

      lista.appendChild(div);

    });

  }

  atualizarSelectsEquipas();

}


// ==========================================
// SELECTS DE EQUIPAS
// ==========================================

function atualizarSelectsEquipas() {

  const casa = document.getElementById("equipaCasa");
  const fora = document.getElementById("equipaFora");

  casa.innerHTML =
    '<option value="">Selecionar equipa</option>';

  fora.innerHTML =
    '<option value="">Selecionar equipa</option>';

  equipasCache.forEach(equipa => {

    [casa, fora].forEach(select => {

      const option = document.createElement("option");

      option.value = equipa.id;
      option.textContent = equipa.nome;

      select.appendChild(option);

    });

  });

}


// ==========================================
// ADICIONAR EQUIPA
// ==========================================

async function adicionarEquipa() {

  const nome = document
    .getElementById("nomeEquipa")
    .value.trim();

  const grupo = document
    .getElementById("grupoEquipa")
    .value.trim();

  if (!nome) {
    alert("⚠️ Coloca o nome da equipa.");
    return;
  }

  const { error } = await clienteSupabase
    .from("equipas")
    .insert({
      nome,
      grupo: grupo || null,
      cor: "normal"
    });

  if (error) {

    alert(
      "❌ Erro ao adicionar equipa:\n\n" + error.message
    );

    return;
  }

  document.getElementById("nomeEquipa").value = "";
  document.getElementById("grupoEquipa").value = "";

  alert("✅ Equipa adicionada com sucesso!");

  await carregarEquipas();

}


// ==========================================
// APAGAR EQUIPA
// ==========================================

async function apagarEquipa(id) {

  const confirmar = confirm(
    "⚠️ Tens a certeza que queres apagar esta equipa?\n\n" +
    "Esta ação pode afetar jogos e classificação."
  );

  if (!confirmar) return;

  const { error } = await clienteSupabase
    .from("equipas")
    .delete()
    .eq("id", id);

  if (error) {

    alert(
      "❌ Erro ao apagar equipa:\n\n" + error.message
    );

    return;
  }

  const atualizacao = await recalcularClassificacao();

  if (!atualizacao.ok) {

    alert(
      "A equipa foi apagada, mas a classificação não foi atualizada:\n\n" +
      atualizacao.error
    );

  } else {

    alert("✅ Equipa apagada com sucesso!");

  }

  await carregarDados();

}


// ==========================================
// ADICIONAR JOGO
// ==========================================

async function adicionarJogo() {

  const faseId = Number(
    document.getElementById("faseJogo").value
  );

  const equipaCasa = document.getElementById("equipaCasa").value;
  const equipaFora = document.getElementById("equipaFora").value;

  const dataJogo = document.getElementById("dataJogo").value;
  const horaJogo = document.getElementById("horaJogo").value;

  const localJogo = document
    .getElementById("localJogo")
    .value.trim();

  if (!IDS_FASES.includes(faseId)) {
    alert("⚠️ Seleciona uma fase válida.");
    return;
  }

  if (!equipaCasa || !equipaFora) {
    alert("⚠️ Seleciona as duas equipas.");
    return;
  }

  if (equipaCasa === equipaFora) {
    alert("⚠️ As equipas não podem ser iguais.");
    return;
  }

  const { error } = await clienteSupabase
    .from("jogos")
    .insert({

      equipa_casa_id: Number(equipaCasa),
      equipa_fora_id: Number(equipaFora),

      fase_id: faseId,

      data_jogo: dataJogo || null,
      hora_jogo: horaJogo || null,
      local: localJogo || null,

      pontos_casa: 0,
      pontos_fora: 0,

      estado: "agendado"

    });

  if (error) {

    alert(
      "❌ Erro ao criar jogo:\n\n" + error.message
    );

    return;
  }

  alert(
    "✅ Jogo criado!\n\n" +
    "Fase: " + obterNomeFase(faseId)
  );

  document.getElementById("equipaCasa").value = "";
  document.getElementById("equipaFora").value = "";
  document.getElementById("dataJogo").value = "";
  document.getElementById("horaJogo").value = "";
  document.getElementById("localJogo").value = "";

  document.getElementById("faseJogo").value = "6";

  await carregarJogos();

}


// ==========================================
// CARREGAR JOGOS
// ==========================================

async function carregarJogos() {

  const lista = document.getElementById("listaJogos");

  const { data, error } = await clienteSupabase
    .from("jogos")
    .select(`
      id,
      fase_id,
      data_jogo,
      hora_jogo,
      local,
      pontos_casa,
      pontos_fora,
      estado,
      equipa_casa_id,
      equipa_fora_id
    `)
    .order("data_jogo", { ascending: true })
    .order("hora_jogo", { ascending: true });

  if (error) {

    console.error(error);
    throw error;

  }

  lista.innerHTML = "";

  if (!data || data.length === 0) {

    lista.innerHTML =
      '<p class="vazio">Nenhum jogo cadastrado.</p>';

    return;
  }

  const mapaEquipas = {};

  equipasCache.forEach(equipa => {
    mapaEquipas[equipa.id] = equipa.nome;
  });

  // Agrupar jogos por fase

  IDS_FASES.forEach(faseId => {

    const jogosFase = data.filter(
      jogo => Number(jogo.fase_id) === faseId
    );

    const titulo = document.createElement("h3");

    titulo.className = "titulo-fase";

    titulo.textContent =
      obterNomeFase(faseId) +
      " (" + jogosFase.length + " jogos)";

    lista.appendChild(titulo);

    if (jogosFase.length === 0) {

      const vazio = document.createElement("p");

      vazio.className = "vazio";
      vazio.textContent = "Nenhum jogo nesta fase.";

      lista.appendChild(vazio);

      return;
    }

    jogosFase.forEach(jogo => {

      criarCartaoJogo(jogo, mapaEquipas, lista);

    });

  });

  // Jogos antigos sem fase ou com ID desconhecido.
  // Não são eliminados nem atribuídos automaticamente a outra fase.

  const jogosSemFase = data.filter(
    jogo => !IDS_FASES.includes(Number(jogo.fase_id))
  );

  if (jogosSemFase.length > 0) {

    const titulo = document.createElement("h3");

    titulo.className = "titulo-fase";
    titulo.textContent = "⚠️ Jogos sem fase válida";

    lista.appendChild(titulo);

    jogosSemFase.forEach(jogo => {

      criarCartaoJogo(jogo, mapaEquipas, lista);

    });

  }

}


// ==========================================
// CARTÃO DE CADA JOGO
// ==========================================

function criarCartaoJogo(jogo, mapaEquipas, lista) {

  const nomeCasa =
    mapaEquipas[jogo.equipa_casa_id] || "Equipa";

  const nomeFora =
    mapaEquipas[jogo.equipa_fora_id] || "Equipa";

  const faseId = Number(jogo.fase_id);

  const div = document.createElement("div");

  div.className = "jogo";

  const opcoesFase = fasesCache.map(fase => `

    <option
      value="${fase.id}"
      ${faseId === Number(fase.id) ? "selected" : ""}
    >
      ${escaparHTML(fase.nome)}
    </option>

  `).join("");

  const opcaoSemFase = !IDS_FASES.includes(faseId)
    ? `<option value="" selected>Selecionar fase</option>`
    : "";

  div.innerHTML = `

    <strong>
      ${escaparHTML(nomeCasa)}
      ×
      ${escaparHTML(nomeFora)}
    </strong>

    <br>

    <span class="estado">
      ${escaparHTML(jogo.estado || "Sem estado")}
    </span>

    <div class="info">

      📅 Data:
      ${escaparHTML(jogo.data_jogo || "-")}

      <br>

      🕐 Hora:
      ${escaparHTML(
        jogo.hora_jogo
          ? jogo.hora_jogo.substring(0, 5)
          : "-"
      )}

      <br>

      📍 Local:
      ${escaparHTML(jogo.local || "-")}

    </div>

    <label>Fase do jogo</label>

    <select id="fase-${jogo.id}">
      ${opcaoSemFase}
      ${opcoesFase}
    </select>

    <div class="resultado">

      <input
        type="number"
        min="0"
        step="1"
        id="casa-${jogo.id}"
        value="${jogo.pontos_casa ?? 0}"
      >

      <strong>×</strong>

      <input
        type="number"
        min="0"
        step="1"
        id="fora-${jogo.id}"
        value="${jogo.pontos_fora ?? 0}"
      >

    </div>

    <label>Estado do jogo</label>

    <select id="estado-${jogo.id}">

      <option
        value="agendado"
        ${jogo.estado === "agendado" ? "selected" : ""}
      >
        Agendado
      </option>

      <option
        value="em_andamento"
        ${jogo.estado === "em_andamento" ? "selected" : ""}
      >
        Em andamento
      </option>

      <option
        value="terminado"
        ${jogo.estado === "terminado" ? "selected" : ""}
      >
        Terminado
      </option>

    </select>

    <button
      class="btn-verde"
      onclick="guardarResultado(${Number(jogo.id)})"
    >
      💾 Guardar alterações
    </button>

    <button
      class="btn-vermelho"
      onclick="apagarJogo(${Number(jogo.id)})"
    >
      🗑️ Apagar jogo
    </button>

  `;

  lista.appendChild(div);

}


// ==========================================
// RECALCULAR CLASSIFICAÇÃO
// ==========================================

async function recalcularClassificacao() {

  const { error } = await clienteSupabase
    .rpc("recalcular_classificacao");

  if (error) {

    console.error(
      "Erro ao recalcular classificação:",
      error
    );

    return {
      ok: false,
      error: error.message
    };

  }

  return {
    ok: true
  };

}


// ==========================================
// GUARDAR RESULTADO E FASE
// ==========================================

async function guardarResultado(id) {

  const campoCasa =
    document.getElementById("casa-" + id);

  const campoFora =
    document.getElementById("fora-" + id);

  const campoEstado =
    document.getElementById("estado-" + id);

  const campoFase =
    document.getElementById("fase-" + id);

  if (
    !campoCasa ||
    !campoFora ||
    !campoEstado ||
    !campoFase
  ) {

    alert("❌ Não foi possível encontrar os campos do jogo.");

    return;
  }

  if (
    campoCasa.value === "" ||
    campoFora.value === ""
  ) {

    alert("⚠️ Preenche os dois resultados.");

    return;
  }

  const pontosCasa = Number(campoCasa.value);
  const pontosFora = Number(campoFora.value);

  const estado = campoEstado.value;
  const faseId = Number(campoFase.value);

  if (
    !Number.isInteger(pontosCasa) ||
    !Number.isInteger(pontosFora) ||
    pontosCasa < 0 ||
    pontosFora < 0
  ) {

    alert("⚠️ Os resultados devem ser números inteiros não negativos.");

    return;
  }

  if (!IDS_FASES.includes(faseId)) {

    alert("⚠️ Seleciona uma fase válida.");

    return;
  }

  // Guardar resultado, estado e fase.

  const { data, error } = await clienteSupabase
    .from("jogos")
    .update({

      pontos_casa: pontosCasa,
      pontos_fora: pontosFora,

      estado: estado,
      fase_id: faseId

    })
    .eq("id", id)
    .select()
    .single();

  if (error) {

    alert(
      "❌ Erro ao guardar alterações:\n\n" +
      error.message
    );

    return;
  }

  // Recalcular sempre.
  // Isto também remove resultados de jogos reabertos,
  // eliminados da fase de grupos ou transferidos de fase.

  const resultado = await recalcularClassificacao();

  if (!resultado.ok) {

    alert(
      "⚠️ O jogo foi atualizado, mas ocorreu um erro na classificação:\n\n" +
      resultado.error
    );

    await carregarDados();

    return;
  }

  alert(

    "✅ Alterações guardadas!\n\n" +

    nomeEquipaPorId(data.equipa_casa_id) +
    " " + data.pontos_casa +
    " × " +
    data.pontos_fora + " " +
    nomeEquipaPorId(data.equipa_fora_id) +

    "\n\nFase: " + obterNomeFase(data.fase_id) +

    "\nEstado: " + data.estado +

    "\n\n📊 Classificação recalculada!"

  );

  await carregarJogos();

}


// ==========================================
// NOME DA EQUIPA POR ID
// ==========================================

function nomeEquipaPorId(id) {

  const equipa = equipasCache.find(
    item => Number(item.id) === Number(id)
  );

  return equipa ? equipa.nome : "Equipa";

}


// ==========================================
// APAGAR JOGO
// ==========================================

async function apagarJogo(id) {

  const confirmar = confirm(
    "⚠️ Tens a certeza que queres apagar este jogo?\n\n" +
    "A classificação será recalculada."
  );

  if (!confirmar) return;

  const { error } = await clienteSupabase
    .from("jogos")
    .delete()
    .eq("id", id);

  if (error) {

    alert(
      "❌ Erro ao apagar jogo:\n\n" + error.message
    );

    return;
  }

  const resultado = await recalcularClassificacao();

  if (!resultado.ok) {

    alert(
      "⚠️ Jogo apagado, mas a classificação não foi atualizada:\n\n" +
      resultado.error
    );

  } else {

    alert(
      "✅ Jogo apagado!\n\nClassificação recalculada."
    );

  }

  await carregarDados();

}


// ==========================================
// CARREGAR TODOS OS DADOS
// ==========================================

async function carregarDados() {

  if (!clienteSupabase) {
    return;
  }

  mostrarMensagem("🔄 A carregar dados...");

  try {

    await carregarFases();

    await carregarEquipas();

    await carregarJogos();

    mostrarMensagem(
      "🟢 Supabase conectado! Dados atualizados.",
      "sucesso"
    );

  } catch (error) {

    console.error(
      "Erro ao carregar dados:",
      error
    );

    mostrarMensagem(
      "🔴 Erro ao carregar dados: " + error.message,
      "erro"
    );

  }

}


// ==========================================
// INICIAR
// ==========================================

document.addEventListener(
  "DOMContentLoaded",
  function() {

    carregarDados();

  }
);

</script>
